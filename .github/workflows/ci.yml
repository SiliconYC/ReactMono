name: ReactMono 验证
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
concurrency:
  group: reactmono-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: 真实 Chromium 端到端回归（本地 HTTP 子路径）
        run: |
          python -m pip install playwright
          python tests/browser_live_e2e.py
          python tests/browser_multiplayer_e2e.py
          python tests/browser_map_layout_e2e.py
          python tests/browser_local_multiplayer_e2e.py
          python tests/browser_second_map_e2e.py
          python tests/browser_liquidation_e2e.py
          python tests/browser_bank_e2e.py
          python tests/browser_loan_e2e.py
          python tests/browser_stocks_e2e.py
          python tests/browser_strategy_e2e.py
          python tests/browser_facilities_e2e.py
          python tests/browser_saves_e2e.py
          python tests/browser_import_e2e.py
          python tests/browser_offline_e2e.py
          python tests/browser_p2_acceptance.py
          python tests/browser_sw_upgrade_e2e.py
          python tests/browser_public_e2e.py
          python tests/browser_agent_styles_e2e.py
          python tests/browser_assets_e2e.py
          python tests/browser_p3_public_final_e2e.py
      - name: 留存 #43 桌面与手机 Chromium 截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue43-assets-chromium
          path: artifacts/issue43/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: 留存 #42 浏览器截图证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue42-chromium-screenshots
          path: artifacts/issue42/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: 留存 #45 1000 局原始记录与公网 Chromium 截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue45-final-acceptance
          path: artifacts/issue45/
          if-no-files-found: warn
          retention-days: 30
      - name: P4 #62 六视口真实 Chromium 体验基线
        run: python tests/browser_p4_baseline_e2e.py
      - name: 保留 P4 #62 浏览器审计原始截图和指标
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue62-experience-baseline
          path: artifacts/issue62/
          if-no-files-found: warn
          retention-days: 30
      - name: P4 #63 原创美术 React 切片真实浏览器回归
        run: python tests/browser_p4_visual_lab_e2e.py
      - name: 保留 P4 #63 桌面与手机交互截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue63-original-art-chromium
          path: artifacts/issue63/
          if-no-files-found: warn
          retention-days: 30
      - name: 确认产物不含第三方运行时引用
        run: "! grep -R -E 'https?://(unpkg|cdn|esm.sh)' dist/index.html"
