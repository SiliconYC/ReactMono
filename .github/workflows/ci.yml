name: ReactMono 验证
on:
  push:
    branches: [dev, 'issue-*']
  pull_request:
    branches: [dev]
concurrency:
  group: reactmono-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: 真实 Chromium 端到端回归（本地 HTTP 子路径）
        run: |
          python -m pip install playwright
          python tests/browser_live_e2e.py
          python tests/browser_multiplayer_e2e.py
          python tests/browser_map_layout_e2e.py
          python tests/browser_local_multiplayer_e2e.py
          python tests/browser_second_map_e2e.py
          python tests/browser_liquidation_e2e.py
          python tests/browser_bank_e2e.py
          python tests/browser_saves_e2e.py
          python tests/browser_import_e2e.py
          python tests/browser_offline_e2e.py
          python tests/browser_p2_acceptance.py
          python tests/browser_sw_upgrade_e2e.py
          python tests/browser_public_e2e.py
      - name: 确认产物不含第三方运行时引用
        run: "! grep -R -E 'https?://(unpkg|cdn|esm.sh)' dist/index.html"
