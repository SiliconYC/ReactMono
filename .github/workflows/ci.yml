name: ReactMono 验证
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
concurrency:
  group: reactmono-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: P4 #71 固定种子 1000 局基线 + 1000 局交叉对照
        run: node scripts/p4-balance-experiment.mjs
      - name: 保留 #71 全部 2000 局动作轨迹及量化采纳/拒绝结论
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue71-balance-1000-pairs
          path: artifacts/issue71/
          if-no-files-found: warn
          retention-days: 30
      - name: 准备中文字体（真实棋盘截图不能出现方框字）
        run: |
          if ! fc-list :lang=zh family | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends fonts-wqy-microhei
            fc-cache -f
          fi
      - name: 准备 Playwright（供 P4 与旧回归共用）
        run: python -m pip install playwright
      - name: 3D demo 地产、金融、租金与胜负完整对局 Chromium 回归
        timeout-minutes: 10
        run: python -u tests/browser_demo3d_e2e.py -v
      - name: 保留 3D demo 桌面手机金融与演出证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo3d-property-rent-chromium
          path: artifacts/demo-*
          if-no-files-found: warn
          retention-days: 30
      # Main-game UI migrated from the 2D DOM to the real 3D scene.
      # See docs/main-game-ui-redesign/test-migration.md for the preserved contracts.
      - name: 原创美术样例独立浏览器回归
        run: python tests/browser_p4_visual_lab_e2e.py
      - name: 主程序七视口标题、准备、购地、金融及键盘检查
        run: python -u tests/browser_ui_rebuild_e2e.py
      - name: 主程序两图四人完整对局、规则功能、动画与离线存档
        timeout-minutes: 10
        run: python -u tests/browser_main_game_acceptance.py
      - name: 数据关卡五图选择、压力地图移动、存档及离线回归
        timeout-minutes: 10
        run: python -u tests/browser_stress_maps_e2e.py
      - name: P007 五图真实路线像素、远端浏览、双指和移动帧检查
        timeout-minutes: 5
        run: python -u tests/browser_scalable_world_e2e.py
      - name: P007 越界停绘、松手误选、跨图和平局镜头
        timeout-minutes: 3
        run: python -u tests/browser_world_navigation_edges.py
      - name: P007 满建360格地图与多次导航资源检查
        timeout-minutes: 3
        run: python -u tests/browser_world_populated_e2e.py
      - name: 主程序WebAudio/GPU、损坏文件拒绝与双SW更新检查
        timeout-minutes: 5
        run: python -u tests/browser_main_runtime_e2e.py
      - name: 保留主程序真实画面、功能、运行时与资源预算证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-game-3d-ui-acceptance
          path: |
            artifacts/ui-rebuild/
            artifacts/main3d/
            artifacts/issue63/
            artifacts/stress-maps/
            artifacts/scalable-world/
          if-no-files-found: warn
          retention-days: 30
      - name: 确认产物不含第三方运行时引用
        run: "! grep -R -E 'https?://(unpkg|cdn|esm.sh)' dist/index.html"
