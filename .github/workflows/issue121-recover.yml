name: Issue121 evidence recovery and native economy
on:
  push:
    branches: [research-121-visual-economy-20261021]
    paths:
      - .github/workflows/issue121-recover.yml
permissions:
  actions: read
  contents: write
jobs:
  recover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Restore independently captured six Chromium screenshots from run 39471057645
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/research/verification-issue-121/evidence
          gh run download 39471057645 -R SiliconYC/ReactMono -n issue121-independent-execution -D docs/research/verification-issue-121/evidence
      - name: Install C++ font library needed by native reverse-engineering tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libfreetype-dev
      - name: Run fixed-SHA native upstream economic experiments (independent of browser)
        id: economy
        continue-on-error: true
        run: python -u docs/research/verification-issue-121/run_economy.py
      - name: Preserve combined independent Chromium and economic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue121-final-recovered-evidence
          path: docs/research/verification-issue-121/evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Commit original screenshots, logs, and native economic results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/verification-issue-121/evidence/
          if ! git diff --cached --quiet; then
            git commit -m "research(#121): preserve six independent Chromium captures and native economics"
            git push origin HEAD:research-121-visual-economy-20261021
          fi
