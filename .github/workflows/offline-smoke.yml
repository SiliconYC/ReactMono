name: 一次性 React Three.js 离线依赖及独立浏览器验证
on:
  push:
    branches:
      - experiment/offline-react-three-20261016
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 在线安装并记录锁定依赖
        working-directory: tools/offline-smoke
        run: npm install --ignore-scripts --no-audit --no-fund --cache .npm-cache
      - name: 首次构建
        working-directory: tools/offline-smoke
        run: npm run build
      - name: 验证缓存能够完全离线重新安装
        working-directory: tools/offline-smoke
        env:
          npm_config_offline: 'true'
          npm_config_registry: http://127.0.0.1:9
        run: |
          rm -rf node_modules
          npm ci --offline --ignore-scripts --no-audit --no-fund --cache .npm-cache
          npm run build
      - name: 准备独立 Playwright Headless Shell
        working-directory: tools/offline-smoke
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tools/offline-smoke/.browser-cache
        run: |
          python -m pip install 'playwright==1.57.0' pillow
          python -m playwright install chromium-headless-shell
      - name: 在 Runner 使用真实 WebGL 和 React 按钮验收
        working-directory: tools/offline-smoke
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tools/offline-smoke/.browser-cache
        run: python tests/browser_smoke.py --out browser-e2e-result
      - name: 制作完全离线的 Node 与浏览器运行包
        run: |
          tar -czf offline-react-three-browser-linux-node22.tar.gz -C tools/offline-smoke package.json package-lock.json index.html src dist node_modules .npm-cache .browser-cache tests
          sha256sum offline-react-three-browser-linux-node22.tar.gz > SHA256SUMS-BROWSER
          ls -lh offline-react-three-browser-linux-node22.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-react-three-browser-linux-node22
          path: |
            offline-react-three-browser-linux-node22.tar.gz
            SHA256SUMS-BROWSER
            tools/offline-smoke/browser-e2e-result/
          retention-days: 90
          if-no-files-found: warn
