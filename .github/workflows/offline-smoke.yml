name: React Three.js 独立浏览器环境验证
on:
  push:
    branches:
      - experiment/offline-react-three-20261016
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 在线准备现有依赖
        working-directory: tools/offline-smoke
        run: npm install --ignore-scripts --no-audit --no-fund --cache .npm-cache
      - name: 离线重装构建
        working-directory: tools/offline-smoke
        env:
          npm_config_offline: 'true'
          npm_config_registry: http://127.0.0.1:9
        run: |
          rm -rf node_modules
          npm ci --offline --ignore-scripts --no-audit --no-fund --cache .npm-cache
          npm run build
      - name: 下载独立完整 Chromium 与依赖
        working-directory: tools/offline-smoke
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tools/offline-smoke/.browser-cache
        run: |
          python -m pip install 'playwright==1.57.0' pillow
          python -m playwright install chromium
      - name: 在 Runner 验证完整 Chromium WebGL
        continue-on-error: true
        working-directory: tools/offline-smoke
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tools/offline-smoke/.browser-cache
        run: python tests/browser_smoke.py --channel chromium --out browser-e2e-full
      - name: 输出完整 Chromium Linux 依赖包
        run: |
          tar -czf offline-full-chromium-linux.tar.gz -C tools/offline-smoke/.browser-cache chromium-1200
          sha256sum offline-full-chromium-linux.tar.gz > SHA256SUMS-FULL
          ls -lh offline-full-chromium-linux.tar.gz
      - name: 保存供沙盒验收的 Chromium
        uses: actions/upload-artifact@v4
        with:
          name: offline-full-chromium-linux
          path: |
            offline-full-chromium-linux.tar.gz
            SHA256SUMS-FULL
            tools/offline-smoke/browser-e2e-full/
          retention-days: 90
