[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reactmono-rich4-pygame"
version = "0.1.0"
description = "Independent Python port of the pinned Richman 4 C++ reconstruction"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["pygame==2.6.1"]

[project.scripts]
rich4-pygame = "rich4.game_cli:主程序"
rich4-preview = "rich4.app:主程序"

[dependency-groups]
dev = ["pytest==8.3.5", "tree-sitter==0.25.2", "tree-sitter-cpp==0.23.4", "ruff==0.11.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["assets: requires external proprietary game files", "differential: requires the pinned C++ test oracle"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/rich4"]
